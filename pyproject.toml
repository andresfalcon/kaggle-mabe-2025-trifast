[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaggle-mabe-2025-trifast"
version = "0.1.0"
description = "MABe mouse behavior detection - trifast pipeline"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Andres", email = "pmp.afalcon@gmail.com" }
]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "scikit-learn==1.5.1",
  "torch==2.4.1",
  "torchvision==0.19.1",
  "pyarrow",
  "tqdm",
  "matplotlib",
  "seaborn",
  "ipykernel"
]

[tool.hatch.build.targets.wheel]
packages = ["src/mabe"]

[tool.hatch.build.targets.sdist]
include = [
  "src/mabe",
  "README.md",
  "configs",
  "pyproject.toml",
]

